name: HOME 4.1.0 original optional data opt-out to native Phase 5

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/home41-phase4-decline-to-phase5-once.yml'

permissions:
  contents: read

concurrency:
  group: home41-phase4-decline-to-phase5-once
  cancel-in-progress: false

jobs:
  one-original-phase4-opt-out:
    if: contains(github.event.head_commit.message, '[home41-phase4-decline-once]')
    name: Click official 不同意 once, inspect native Phase and masked post-decline screen
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test exact Phase 4 visual and native evidence guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow 'frida==17.26.1'
          python -m py_compile \
            ci/home41_emulator_arm64_realm.py \
            ci/home41_phase4_decline_once.py \
            ci/home41_phase4_post_decline_capture.py \
            ci/home41_phase4_masked_capture.py \
            ci/home41_terms_probe.py
          node --check ci/home41_arm64_auth_timeline.js
          python -m unittest discover -s ci -p 'test_home41_phase4_decline_once.py' -v
          python -m unittest discover -s ci -p 'test_home41_phase4_post_decline_capture.py' -v
          python -m unittest discover -s ci -p 'test_home41_phase4_masked_capture.py' -v
          python -m unittest discover -s ci -p 'test_home41_post_terms_phase.py' -v
          python -m unittest discover -s ci -p 'test_home41_terms_both_and_next.py' -v
          python -m unittest discover -s ci -p 'test_home41_emulator_arm64_realm.py' -v
          APK="$(find ROMS/4.1.0 -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = '8dee598028cd70441f645c8fff96b093b76778d625cdf07c60109eced50ffac1'
          echo "HOME41_APK=$APK" >> "$GITHUB_ENV"
          mkdir -p ci-frida-results

      - name: Download exact Frida server with retry
        shell: bash
        run: |
          set -euo pipefail
          V="$(python -c 'import frida; print(frida.__version__)')"
          test "$V" = "17.26.1"
          curl -fLsS --retry 7 --retry-all-errors --retry-delay 3 --retry-max-time 420 \
            --connect-timeout 20 --max-time 180 \
            "https://github.com/frida/frida/releases/download/$V/frida-server-$V-android-x86_64.xz" \
            -o /tmp/home41_frida_server.xz
          xz -dc /tmp/home41_frida_server.xz > /tmp/home41_frida_server
          chmod 700 /tmp/home41_frida_server
          echo "HOME41_FRIDA_SERVER=/tmp/home41_frida_server" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Original Phase 3 Terms, Phase 4 不同意 once, then observe Phase 5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          pre-emulator-launch-script: adb start-server
          script: |
            set -e
            python ci/home41_emulator_arm64_realm.py --apk "$HOME41_APK" --output ci-frida-results --server "$HOME41_FRIDA_SERVER" --settle-seconds 10 --probe-birthday-year --select-local-year-1999 --select-local-month-day --probe-native-full-date-select --advance-birthday-once --probe-terms-next-phase-once --authorize-terms-next-phase-once --probe-phase4-decline-once --authorize-phase4-decline-once

      - name: Upload ONLY masked Phase 4 pre-opt-out and categorical native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-phase4-decline-native-phase5-evidence
          path: |
            ci-frida-results/home41_post_terms_phase_report.json
            ci-frida-results/home41_phase4_decline/phase4_before_masked.png
            ci-frida-results/home41_phase4_decline/phase4_decline_status.json
            ci-frida-results/home41_phase4_decline/post_decline_masked.png
            ci-frida-results/home41_phase4_decline/post_decline_capture_status.json
          retention-days: 1
          if-no-files-found: warn

      - name: Record precise original FirstBoot phases, never claim registration
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('ci-frida-results/home41_post_terms_phase_report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n## Phase 4 optional info collection decline and original Phase 5\n\n')
              if p.is_file():
                  r=json.loads(p.read_text(encoding='utf8'))
                  out.write('- Native Phase before decline: '+str(r.get('native_phase',{}).get('current_phase_name'))+'\n')
                  opt=r.get('phase4_decline_probe',{})
                  for k in ('status','decline_button_tapped','post_decline_screen_changed',
                            'agree_button_tapped','account_registration_attempted'):
                      out.write(f'- Phase 4 {k}: {opt.get(k)}\n')
                  capture=r.get('post_decline_capture',{})
                  out.write('- Phase 4 post-decline masked screen saved: '+str(capture.get('masked_screenshot_saved'))+'\n')
                  post=r.get('post_phase4_native',{})
                  for k in ('status','current_phase_index','current_phase_name',
                            'last_requested_phase_index','last_requested_phase_name',
                            'go_to_phase_entries_before','go_to_phase_entries_after'):
                      out.write(f'- Native after decline {k}: {post.get(k)}\n')
              else:
                  out.write('- No validated Phase 4 result available.\n')
              out.write('\nNever clicks opt-in, Nintendo Account linking or registration. No account, UTID or unmasked screen is uploaded.\n')
          PY
