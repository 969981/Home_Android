name: HOME 4.1.0 verified post-age consent UI fingerprint (no signup)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/home41-post-age-terms-fingerprint.yml'
      - 'ci/home41_post_age_terms_fingerprint.py'
      - 'ci/test_home41_post_age_terms_fingerprint.py'
      - 'ci/home41_emulator_diagnostics.py'
      - 'ci/home41_emulator_arm64_realm.py'
      - 'ci/home41_terms_probe.py'
      - 'ci/test_home41_terms_probe.py'
      - 'ci/home41_arm64_auth_timeline.js'
      - 'ci/home41_arm64_auth_timeline.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home41-post-age-terms-fingerprint
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only accessibility categories after one original age Next
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original APK and fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow 'frida==17.26.1'
          python -m py_compile ci/home41_terms_probe.py ci/home41_post_age_terms_fingerprint.py
          node --check ci/home41_arm64_auth_timeline.js
          python -m unittest discover -s ci -p 'test_home41_terms_probe.py' -v
          python -m unittest discover -s ci -p 'test_home41_post_age_terms_fingerprint.py' -v
          python -m unittest discover -s ci -p 'test_home41_emulator_arm64_realm.py' -v
          APK="$(find ROMS/4.1.0 -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = '8dee598028cd70441f645c8fff96b093b76778d625cdf07c60109eced50ffac1'
          echo "HOME41_APK=$APK" >> "$GITHUB_ENV"
          mkdir -p ci-frida-results

      - name: Obtain Frida matching HOME ARM native bridge
        shell: bash
        run: |
          set -euo pipefail
          FRIDA_VERSION="$(python -c 'import frida; print(frida.__version__)')"
          test "$FRIDA_VERSION" = "17.26.1"
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 150 \
            "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-server-$FRIDA_VERSION-android-x86_64.xz" \
            -o /tmp/home41_frida_server.xz
          xz -dc /tmp/home41_frida_server.xz > /tmp/home41_frida_server
          chmod 700 /tmp/home41_frida_server
          test -s /tmp/home41_frida_server
          echo "HOME41_FRIDA_SERVER=/tmp/home41_frida_server" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Original HOME age page once, then inspect next screen without clicks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -e
            python ci/home41_emulator_arm64_realm.py --apk "$HOME41_APK" --output ci-frida-results --server "$HOME41_FRIDA_SERVER" --settle-seconds 10 --probe-birthday-year --select-local-year-1999 --select-local-month-day --probe-native-full-date-select --advance-birthday-once
            python ci/home41_post_age_terms_fingerprint.py --report ci-frida-results/home41_emulator_report.json --output ci-frida-results/home41_post_age_terms_fingerprint.json

      - name: Display safe UI fingerprint, never raw screen/text
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('ci-frida-results/home41_post_age_terms_fingerprint.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n## Original HOME 4.1.0 post-age pre-consent screen\n\n')
              if not path.is_file():
                  out.write('Read-only fingerprint unavailable; no Terms click was attempted.\n')
              else:
                  obj=json.loads(path.read_text(encoding='utf-8'))
                  for k in ('status','age_next_native_verified','home_foreground',
                            'terms_marker','privacy_marker','unique_terms_next_button',
                            'unique_final_agree_button','native_terms_setup_event_seen',
                            'native_clause_creation_event_seen',
                            'native_checkbox_change_event_seen',
                            'native_terms_dialog_open_event_seen',
                            'native_terms_dialog_ok_event_seen',
                            'native_terms_page_visible_verified',
                            'terms_click_attempted',
                            'account_registration_attempted','raw_text_or_xml_saved',
                            'screenshot_saved','basic_utid_saved'):
                      out.write(f'- {k}: {obj.get(k)}\n')
              out.write('\nNo consent, account creation, token capture or screenshots in this workflow.\n')
          PY

      - name: Upload only redacted categorical JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-post-age-terms-fingerprint
          path: ci-frida-results/home41_post_age_terms_fingerprint.json
          retention-days: 3
          if-no-files-found: warn
