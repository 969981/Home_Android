name: HOME 4.1.0 original guest confirmation direct-call static audit

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/home41-guest-native-static.yml'

permissions:
  contents: read

jobs:
  original-binary-guest-callgraph:
    if: contains(github.event.head_commit.message, '[home41-guest-native-static]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline A64 and raw ELF safety tests
        run: |
          set -euo pipefail
          python -m pip install -q 'capstone>=5,<6'
          python -m py_compile \
            ci/home41_guest_native_static.py ci/test_home41_guest_native_static.py \
            ci/home41_guest_dispatch_trace.py \
            ci/home41_emulator_arm64_realm.py ci/test_home41_guest_callback_coverage.py \
            ci/home41_arm64_auth_timeline.py ci/test_home41_arm64_auth_timeline.py \
            ci/test_home41_guest_persistent_chain.py \
            ci/home41_private_postguest_screen.py ci/test_home41_private_postguest_screen.py
          node --check ci/home41_arm64_auth_timeline.js
          python -m unittest discover -s ci -p 'test_home41_guest_native_static.py' -v
          python -m unittest discover -s ci -p 'test_home41_guest_callback_coverage.py' -v
          python -m unittest discover -s ci -p 'test_home41_arm64_auth_timeline.py' -v
          python -m unittest discover -s ci -p 'test_home41_guest_persistent_chain.py' -v
          python -m unittest discover -s ci -p 'test_home41_private_postguest_screen.py' -v
      - name: Byte-verified original confirmation callbacks and delegate callees
        run: |
          set -euo pipefail
          apk="$(find ROMS/4.1.0 -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          python ci/home41_guest_native_static.py --apk "$apk" --output ci-frida-results/home41_guest_native_static.json
          python ci/home41_guest_dispatch_trace.py --apk "$apk" --output ci-frida-results/home41_guest_adjacent_callback_x8_static_trace.json
      - name: State verified-only static proof boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## HOME 4.1.0 original AArch64 guest branch proof'
            echo ''
            echo '- Original APK and libil2cpp SHA-256 must both match.'
            echo '- Eight static BL/B targets, guest-start callback and guest-decision field store are asserted.'
            echo '- Original A64 prologue at 0x1D2F9F8 and prior unconditional tail exit isolate a neighboring callback BLR X8 at 0x1D2FA20.'
            echo '- This adjacent callback is NOT a proven call inside AtuhRegisterUser; its runtime target is unknown.'
            echo '- AtuhRegisterUser tail-branches to 0x1D2F1F8; its next bounded 0x330 bytes are independently disassembled, with unknown official name/function extent.'
            echo '- DecisionGestAccount tail B to AtuhRegisterUser is not a proven runtime registration.'
            echo '- This workflow performs NO HOME UI actions, backend registration, ID or Token observation.'
            echo '- Original avatar, prologue and starter method entry hooks remain awaiting device runtime validation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save non-sensitive call-target audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-guest-original-arm64-static-direct-calls
          path: |
            ci-frida-results/home41_guest_native_static.json
            ci-frida-results/home41_guest_adjacent_callback_x8_static_trace.json
          retention-days: 7
          if-no-files-found: warn
